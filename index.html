<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>北境：序章</title>
    <meta name="description" content="北境：序章 — 浏览器里的北地奇幻开场。" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Cpath d='M16 3v26M16 8c-4 3-8 2-11-1 2 5 7 7 11 5 4 2 9 0 11-5-3 3-7 4-11 1z' stroke='%23ddd' fill='none' stroke-width='1.6'/%3E%3C/svg%3E" />
    <link rel="preload" href="./manifest.json" as="fetch" crossorigin />
    <style>
      /* Noto Serif SC (SIL OFL 1.1), subset to the UI's characters by tools/fetch-fonts.mjs */
      @font-face { font-family: "Northern Serif"; src: url("./src/assets/fonts/ui-serif-400.woff2") format("woff2"); font-weight: 400; font-display: swap; }
      @font-face { font-family: "Northern Serif"; src: url("./src/assets/fonts/ui-serif-700.woff2") format("woff2"); font-weight: 700; font-display: swap; }
      :root {
        --ink: #ece7dc;
        --ink-dim: #8e8a82;
        --ink-faint: #4f4c47;
        --glow: rgba(255, 246, 225, 0.55);
        --line: rgba(236, 231, 220, 0.18);
        --line-strong: rgba(236, 231, 220, 0.42);
        --band: rgba(255, 255, 255, 0.07);
        --display: "Northern Serif", "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", "SimSun", serif;
        --serif: var(--display);
        --sans: "Noto Sans SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #000; color: var(--ink); overflow: hidden; font-family: var(--sans); }
      #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
      /* CSS smoke shown until the 3D menu background is running */
      #smoke { position: fixed; inset: -20%; pointer-events: none; opacity: 0.55; transition: opacity 1.6s;
        background:
          radial-gradient(40% 30% at 30% 60%, rgba(120,120,120,.35), transparent 70%),
          radial-gradient(35% 25% at 70% 40%, rgba(110,110,110,.30), transparent 70%),
          radial-gradient(50% 35% at 50% 80%, rgba(90,90,90,.35), transparent 70%);
        animation: drift 28s ease-in-out infinite alternate; filter: blur(18px); }
      #smoke.off { opacity: 0; }
      @keyframes drift { from { transform: translate3d(-4%, 2%, 0) scale(1.05); } to { transform: translate3d(4%, -3%, 0) scale(1.15); } }
      #ui { position: fixed; inset: 0; pointer-events: none; }
      #ui > * { pointer-events: auto; }
      .hidden { display: none !important; }
      button { font: inherit; }

      /* ---------------- shared ornaments: a hairline that fades at both ends with a small diamond */
      .orn { position: relative; height: 9px; flex: 1; min-width: 40px;
        background: linear-gradient(90deg, transparent, var(--line-strong) 30%, var(--line-strong) 70%, transparent) center / 100% 1px no-repeat; }
      .orn.l { background-image: linear-gradient(90deg, transparent, var(--line-strong)); }
      .orn.r { background-image: linear-gradient(90deg, var(--line-strong), transparent); }
      .orn.mid::after { content: ""; position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; border: 1px solid var(--line-strong); background: #000; transform: translate(-50%, -50%) rotate(45deg); }
      .orn.l::after, .orn.r::after { content: ""; position: absolute; top: 50%; width: 5px; height: 5px; background: var(--ink-dim); transform: translateY(-50%) rotate(45deg); }
      .orn.l::after { right: -2px; }
      .orn.r::after { left: -2px; }
      .heading { display: flex; align-items: center; gap: 18px; margin: 0 0 22px; }
      .heading h2 { margin: 0; font-family: var(--display); font-weight: 400; letter-spacing: .55em; padding-left: .55em; font-size: 22px; white-space: nowrap; text-shadow: 0 0 12px rgba(0,0,0,.9); }
      kbd { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 20px; padding: 0 5px; border: 1px solid var(--line-strong); border-radius: 2px; font: 11px/1 var(--sans); color: var(--ink); background: rgba(0,0,0,.4); }

      /* ---------------- main menu */
      #menu { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7vh; pointer-events: none; transition: opacity .8s; }
      #menu::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 75% 70% at 50% 45%, transparent 35%, rgba(0,0,0,.55) 75%, rgba(0,0,0,.9) 100%); }
      #menu.fade { opacity: 0; }
      body:has(#panel) #menu { opacity: 0.08; }
      .title { position: relative; text-align: center; user-select: none; margin-top: 4vh; }
      .title .seal { position: absolute; left: 50%; top: 50%; width: min(56vh, 92vw); height: min(56vh, 92vw); transform: translate(-50%, -54%); opacity: .075; pointer-events: none; }
      .title .seal circle, .title .seal path { vector-effect: non-scaling-stroke; }
      .title .kicker { font-family: var(--display); font-size: clamp(12px, 1.15vw, 15px); letter-spacing: 1.1em; padding-left: 1.1em; color: var(--ink-dim); margin-bottom: 1.2vh; }
      .title h1 { position: relative; margin: 0; font-family: var(--display); font-weight: 700; font-size: clamp(64px, 10.5vw, 150px); line-height: 1.05; letter-spacing: .3em; padding-left: .3em;
        background: linear-gradient(180deg, #ffffff 0%, #e6e1d7 38%, #a29d93 72%, #6e6a63 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
        filter: drop-shadow(0 3px 10px rgba(0,0,0,.95)) drop-shadow(0 0 1px rgba(255,255,255,.25)); }
      .title .sub { display: flex; align-items: center; justify-content: center; gap: 16px; width: min(460px, 80vw); margin: 1.4vh auto 0; }
      .title .sub span { font-family: var(--display); font-size: clamp(15px, 1.5vw, 20px); letter-spacing: .9em; padding-left: .9em; color: #cfc9bd; white-space: nowrap; }
      #menu nav { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; pointer-events: auto; min-height: 230px; }
      #menu nav button { all: unset; position: relative; cursor: pointer; font-family: var(--display); font-size: clamp(16px, 1.45vw, 20px); letter-spacing: .55em; padding: 8px 2.4em 8px calc(2.4em + .55em); color: #75716a; transition: color .18s, text-shadow .18s; text-shadow: 0 0 8px #000; }
      #menu nav button::before { content: ""; position: absolute; inset: 2px 0; background: radial-gradient(ellipse 50% 50% at 50% 50%, var(--band), transparent 70%); opacity: 0; transition: opacity .18s; }
      #menu nav button.sel, #menu nav button:focus-visible { color: #fff; text-shadow: 0 0 14px var(--glow), 0 0 3px #000; }
      #menu nav button.sel::before { opacity: 1; }
      #menu nav button:disabled { color: #4a4742; cursor: default; text-shadow: none; }
      body:has(#menu.hidden) #version { display: none; }
      #version { position: fixed; left: 22px; bottom: 16px; font-size: 11px; letter-spacing: .25em; color: var(--ink-faint); pointer-events: none; }

      /* ---------------- key hints (bottom right, like a console prompt bar) */
      #keyhints { position: fixed; right: 26px; bottom: 16px; display: none; gap: 20px; align-items: center; font-size: 12px; letter-spacing: .15em; color: var(--ink-dim); pointer-events: none; text-shadow: 0 0 4px #000; }
      #keyhints > span { display: inline-flex; align-items: center; gap: 6px; }
      body:has(#menu:not(.hidden)) #keyhints, body:has(#pause) #keyhints { display: flex; }
      #keyhints .k-back { display: none; }
      body:has(#panel) #keyhints .k-back, body:has(#pause) #keyhints .k-back { display: inline-flex; }
      body:has(#panel) #keyhints .k-nav, body:has(#panel) #keyhints .k-ok { display: none; }

      /* ---------------- panels (settings / credits / load) */
      .panel { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(760px, calc(100vw - 24px)); max-height: calc(100vh - 56px); overflow: auto; padding: 30px 56px 26px; font-size: 15px;
        background: rgba(5,5,5,.92);
        box-shadow: 0 0 70px 40px rgba(5,5,5,.92), 0 0 0 100vmax rgba(0,0,0,.55); scrollbar-width: thin; scrollbar-color: var(--ink-faint) transparent; }
      .panel::before, .panel::after { content: ""; position: sticky; display: block; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--line-strong) 20%, var(--line-strong) 80%, transparent); }
      .panel::before { top: -30px; margin: -30px -56px 28px; }
      .panel::after { bottom: -26px; margin: 22px -56px -26px; }
      .panel .row { display: grid; grid-template-columns: 9em 1fr 4.5em; align-items: center; gap: 16px; padding: 6px 12px; margin: 0 -12px; }
      .panel .row:hover { background: linear-gradient(90deg, transparent, var(--band) 15%, var(--band) 85%, transparent); }
      .panel .row label { color: var(--ink-dim); letter-spacing: .12em; }
      .panel .row:hover label { color: var(--ink); }
      .panel .row output { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-dim); font-size: 13px; }
      .panel .btn, .btn { all: unset; cursor: pointer; font-family: var(--display); letter-spacing: .3em; color: var(--ink-dim); padding: 6px 10px; transition: color .15s, text-shadow .15s; }
      .panel .btn:hover, .btn:hover, .btn:focus-visible { color: #fff; text-shadow: 0 0 12px var(--glow); }
      .panel .actions { display: flex; justify-content: center; gap: 36px; margin-top: 18px; }
      .panel .keys { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0 28px; }
      .panel .keys .row { grid-template-columns: 1fr auto 0; }
      .panel .keys .btn { min-width: 6.5em; text-align: center; letter-spacing: .05em; font-family: var(--sans); font-size: 13px; border: 1px solid var(--line); padding: 3px 8px; }
      .panel .keys .btn.wait { border-color: #fff; color: #fff; }
      .panel h3 { display: flex; align-items: center; gap: 14px; font-family: var(--display); font-weight: 400; letter-spacing: .4em; color: var(--ink); margin: 22px 0 8px; font-size: 14px; }
      .panel h3::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line), transparent); }
      .stepper { display: inline-flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; }
      .stepper button { all: unset; cursor: pointer; width: 22px; text-align: center; color: var(--ink-dim); font-size: 13px; }
      .stepper button:hover { color: #fff; }
      .stepper span { flex: 1; text-align: center; letter-spacing: .3em; padding-left: .3em; }
      .credits { line-height: 1.8; font-size: 13.5px; color: #c9c3b6; }
      .credits a { color: #ece4cf; text-decoration: none; border-bottom: 1px solid var(--line); }
      .credits .lic { color: var(--ink-dim); }
      .saves { display: flex; flex-direction: column; }
      .saves button { all: unset; cursor: pointer; display: grid; grid-template-columns: 6em 1fr auto; gap: 16px; padding: 9px 14px; color: var(--ink-dim); }
      .saves button:hover, .saves button:focus-visible { color: #fff; background: linear-gradient(90deg, transparent, var(--band) 12%, var(--band) 88%, transparent); }
      .saves .when { font-size: 12.5px; color: var(--ink-faint); }
      .saves button:hover .when { color: var(--ink-dim); }
      .empty { text-align: center; color: var(--ink-dim); letter-spacing: .3em; }

      /* ---------------- sliders: hairline track, filled part brighter, slim bar thumb */
      input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: transparent; cursor: pointer; --p: 50%; }
      input[type=range]:focus { outline: none; }
      input[type=range]::-webkit-slider-runnable-track { height: 2px; background: linear-gradient(90deg, #cfc9bd var(--p), #3b3935 var(--p)); }
      input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 6px; height: 16px; margin-top: -7px; background: #f4efe4; border: 0; box-shadow: 0 0 8px rgba(255,255,255,.45), 0 0 0 1px #000; }
      input[type=range]::-moz-range-track { height: 2px; background: #3b3935; }
      input[type=range]::-moz-range-progress { height: 2px; background: #cfc9bd; }
      input[type=range]::-moz-range-thumb { width: 6px; height: 16px; border: 0; border-radius: 0; background: #f4efe4; box-shadow: 0 0 8px rgba(255,255,255,.45); }

      /* ---------------- pause menu */
      #pause { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(ellipse 55% 65% at 50% 50%, rgba(0,0,0,.78), rgba(0,0,0,.92)); backdrop-filter: blur(3px) grayscale(.4); }
      #pause .heading { width: min(520px, 86vw); }
      body:has(#panel) #pause { visibility: hidden; }
      .menu-list { display: flex; flex-direction: column; align-items: center; gap: 2px; }
      .menu-list button { all: unset; position: relative; cursor: pointer; font-family: var(--display); font-size: 19px; letter-spacing: .5em; padding: 8px 2.6em 8px calc(2.6em + .5em); color: #75716a; transition: color .15s, text-shadow .15s; }
      .menu-list button::before { content: ""; position: absolute; inset: 2px 0; background: radial-gradient(ellipse 50% 50% at 50% 50%, var(--band), transparent 70%); opacity: 0; transition: opacity .15s; }
      .menu-list button.sel { color: #fff; text-shadow: 0 0 14px var(--glow); }
      .menu-list button.sel::before { opacity: 1; }
      #pause .tail { width: min(520px, 86vw); margin-top: 22px; }

      /* ---------------- in-game overlays */
      #subtitle { position: fixed; left: 50%; bottom: 11vh; transform: translateX(-50%); max-width: min(900px, 86vw); text-align: center; font-size: clamp(16px, 1.5vw, 21px); line-height: 1.55; letter-spacing: .04em; text-shadow: 0 0 6px #000, 0 0 2px #000, 0 1px 2px #000; pointer-events: none; transition: opacity .25s; }
      #subtitle .who { color: #bdb6a6; margin-right: .5em; }
      #loadhint { position: fixed; right: 26px; bottom: 18px; display: flex; align-items: center; gap: 12px; font-family: var(--display); font-size: 12px; letter-spacing: .3em; color: var(--ink-dim); pointer-events: none; opacity: 0; transition: opacity .4s; text-shadow: 0 0 4px #000; }
      #loadhint.on { opacity: 1; }
      #loadhint i { width: 10px; height: 10px; border: 1px solid var(--ink); transform: rotate(45deg); animation: spin 2.4s ease-in-out infinite; }
      @keyframes spin { 0% { transform: rotate(45deg); } 50% { transform: rotate(225deg); opacity: .5; } 100% { transform: rotate(405deg); } }
      #fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity 1.2s; }
      #fade.on { opacity: 1; }
      #crosshair { position: fixed; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px; border-radius: 50%; background: rgba(255,255,255,.7); pointer-events: none; }
      #toast { position: fixed; left: 34px; top: 30px; padding-bottom: 8px; font-family: var(--display); font-size: 17px; letter-spacing: .22em; color: var(--ink); text-shadow: 0 0 6px #000, 0 0 2px #000; pointer-events: none; opacity: 0; transform: translateY(-4px); transition: opacity .6s, transform .6s; }
      #toast::after { content: ""; position: absolute; left: 0; bottom: 0; height: 1px; width: 0; background: linear-gradient(90deg, var(--line-strong), transparent); transition: width 1.2s .2s; }
      #toast.on { opacity: 1; transform: none; }
      #toast.on::after { width: 120%; }
      #dlstatus { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); font-size: 11px; color: var(--ink-faint); pointer-events: none; letter-spacing: .2em; }
      #prompt { position: fixed; left: 50%; bottom: 26vh; transform: translateX(-50%); font-size: 14px; letter-spacing: .2em; color: var(--ink-dim); text-shadow: 0 0 4px #000; pointer-events: none; }
      #endcard { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; font-family: var(--display); pointer-events: auto; background: radial-gradient(ellipse at center, rgba(0,0,0,.2), #000 75%); }
      #endcard .heading { width: min(560px, 88vw); margin: 0; }
      #endcard .heading h2 { font-size: clamp(26px, 3.2vw, 40px); }
      #endcard p { color: var(--ink-dim); margin: 0; letter-spacing: .35em; }
      #endcard button { all: unset; cursor: pointer; margin-top: 26px; letter-spacing: .45em; color: var(--ink-dim); padding: 8px 18px; }
      #endcard button:hover, #endcard button:focus-visible { color: #fff; text-shadow: 0 0 12px var(--glow); }
      #fatal { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 16px; background: #000; color: var(--ink); }
      @media (max-width: 600px) {
        .panel { padding: 24px 18px; }
        .panel::before { margin: -24px -18px 22px; } .panel::after { margin: 20px -18px -24px; }
        .panel .row { grid-template-columns: 6.5em 1fr 3.5em; gap: 10px; }
        .panel .keys { grid-template-columns: 1fr; }
        #keyhints { display: none !important; }
      }
    </style>
  </head>
  <body>
    <canvas id="scene" tabindex="0" aria-label="游戏画面"></canvas>
    <div id="smoke"></div>
    <div id="ui">
      <section id="menu" aria-label="主菜单">
        <div class="title">
          <svg class="seal" viewBox="0 0 200 200" aria-hidden="true">
            <g fill="none" stroke="#e8e2d4" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="100" cy="100" r="96" stroke-width="1" />
              <circle cx="100" cy="100" r="91" stroke-width="5" stroke-dasharray="0.7 4.1" />
              <circle cx="100" cy="100" r="86" stroke-width="1" />
              <circle cx="100" cy="100" r="79" stroke-width="7" stroke-dasharray="7 2.5 1.6 2.5 3.5 4 1.6 2 9 2.5 1.6 4 4.5 2.5" />
              <circle cx="100" cy="100" r="72" stroke-width="1" />
              <g stroke-width="2.2">
                <path d="M100 30 L109 47 L100 56 L91 47 Z" />
                <path d="M96 40 L84 28 M104 40 L116 28" />
                <path d="M100 56 C 95 80 106 104 100 128 C 96 144 82 150 76 140 C 72 132 82 126 88 132" />
                <path d="M100 70 C 86 60 64 52 40 58 C 54 62 62 68 66 76 C 56 76 46 82 41 92 C 54 87 64 89 72 95 C 66 102 62 110 62 120 C 72 106 86 98 100 96" />
                <path d="M100 70 C 114 60 136 52 160 58 C 146 62 138 68 134 76 C 144 76 154 82 159 92 C 146 87 136 89 128 95 C 134 102 138 110 138 120 C 128 106 114 98 100 96" />
                <path d="M92 118 L84 124 M108 112 L116 120" />
              </g>
            </g>
          </svg>
          <div class="kicker">北地纪事·卷一</div>
          <h1>北境</h1>
          <div class="sub"><i class="orn l"></i><span>序章</span><i class="orn r"></i></div>
        </div>
        <nav>
          <button data-act="continue" disabled>继续</button>
          <button data-act="new">新游戏</button>
          <button data-act="load" disabled>读取</button>
          <button data-act="settings">设置</button>
          <button data-act="credits">制作人员</button>
        </nav>
      </section>
      <div id="version">序章 · 预览版 M2</div>
      <div id="keyhints"><span class="k-nav"><kbd>↑</kbd><kbd>↓</kbd> 选择</span><span class="k-ok"><kbd>Enter</kbd> 确认</span><span class="k-back"><kbd>Esc</kbd> 返回</span></div>
      <div id="dlstatus"></div>
    </div>
    <noscript><div id="fatal">需要启用 JavaScript 才能运行。</div></noscript>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
